plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'app.voiceflow'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig { applicationId 'app.voiceflow'; minSdk 26; targetSdk 35; versionCode 89; versionName '0.1.17-preview' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    kotlinOptions { jvmTarget = '1.8' }
    buildFeatures { aidl true; buildConfig true }
    packaging { resources { excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF','META-INF/DEPENDENCIES','META-INF/LICENSE','META-INF/LICENSE.txt','META-INF/NOTICE','META-INF/NOTICE.txt'] } }
    signingConfigs {
        preview {
            storeFile rootProject.file(System.getenv('VOICEFLOW_KEYSTORE') ?: 'preview-signing/voiceflow.keystore')
            storePassword 'android'
            keyAlias 'voiceflow'
            keyPassword 'android'
        }
        notesPreview {
            storeFile rootProject.file(System.getenv('VONO_NOTES_KEYSTORE') ?: 'notes-signing/vononotes.keystore')
            storePassword System.getenv('VONO_NOTES_KEYSTORE_PASSWORD') ?: 'android'
            keyAlias 'voiceflow'
            keyPassword System.getenv('VONO_NOTES_KEY_PASSWORD') ?: 'android'
        }
    }
    flavorDimensions 'product'
    productFlavors {
        vonotation {
            dimension 'product'
            applicationId 'app.voiceflow'
            versionCode 92
            versionName '0.1.20-preview'
            if (System.getenv('VONO_UNSIGNED_BUILDS') != 'true') signingConfig signingConfigs.preview
        }
        notes {
            dimension 'product'
            applicationId 'app.vonotation.notes'
            versionCode 2
            versionName '0.1.1-preview'
            if (System.getenv('VONO_UNSIGNED_BUILDS') != 'true') signingConfig signingConfigs.notesPreview
        }
    }
    buildTypes {
        preview {
            initWith release
            debuggable false
            minifyEnabled false
            matchingFallbacks = ['release']
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'com.flyfishxu:kadb:1.3.0'
}
