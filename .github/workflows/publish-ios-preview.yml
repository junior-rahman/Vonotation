name: Publish verified iOS Simulator preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios-release-manifests/**'
      - '.github/workflows/publish-ios-preview.yml'
      - '.github/scripts/publish_ios_preview.py'

permissions:
  contents: write
  actions: read

concurrency:
  group: vonotation-ios-preview-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository_id == '1416658953' && github.repository == 'junior-rahman/Vonotation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out reviewed release manifest
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate native CI evidence and publish simulator-only preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish_ios_preview.py --publish ios-release-manifests/v0.1.17-ios-preview.json
