name: Android native split-app verification

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-visual-ci.yml'

permissions:
  contents: read

concurrency:
  group: android-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build both apps, lint, isolation and light/dark native verification
        run: bash android/scripts/run-visual-ci.sh
      - name: Preserve native evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: VonoTation-Android-split-native-${{ github.sha }}
          path: |
            android/build/visual-ci
            android/app/build/reports/lint-results-vonotationPreview.html
            android/app/build/reports/lint-results-vonotationPreview.xml
            android/app/build/reports/lint-results-notesPreview.html
            android/app/build/reports/lint-results-notesPreview.xml
          if-no-files-found: error
          retention-days: 30
